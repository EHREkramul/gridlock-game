name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  IMAGE_NAME: gridlock-server

jobs:
  verify:
    name: Verify tag and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # A tag that disagrees with the repository produces an app whose version
      # string does not match its own release page. Catch it here rather than
      # after an upload to Play.
      - name: Check the tag matches every package.json and app.json
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node tool/version.mjs check "$TAG")
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  server-image:
    name: Server image (GHCR)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry paths must be lowercase; repository owners often are not.
      - name: Image reference
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          BASE="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE_NAME"
          echo "base=$BASE"            >> "$GITHUB_OUTPUT"
          echo "image=$BASE:$VERSION"  >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ steps.ref.outputs.base }}:${{ needs.verify.outputs.version }}
            ${{ steps.ref.outputs.base }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      # Continuous deployment is opt-in. Most hosts (Render, Railway, Coolify,
      # Dokploy, a small webhook on your own VM, …) expose a "deploy hook" URL
      # that pulls the new image and restarts. Without the secret the image is
      # only published.
      - name: Trigger deploy hook
        id: deploy
        env:
          HOOK: ${{ secrets.SERVER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "::notice::SERVER_DEPLOY_HOOK_URL is not set — image published, nothing deployed."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sS --fail-with-body -o /dev/null -X POST "$HOOK" \
            -H 'Content-Type: application/json' \
            --data "{\"image\":\"$IMAGE\"}"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  web:
    name: Web build
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Export static web build
        env:
          EXPO_PUBLIC_SERVER_URL: ${{ vars.PRODUCTION_SERVER_URL }}
        run: npm run build:web

      - name: Package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd apps/mobile/dist-web && zip -qr "../../../dist/gridlock-$VERSION-web.zip" .)
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: web-release
          path: dist/
          retention-days: 90

  android:
    name: Android artifacts
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      server_url: ${{ steps.server.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The server address is baked into the JS bundle at build time. A release
      # without one would try to reach a development machine and fail.
      - name: Resolve production server URL
        id: server
        env:
          URL: ${{ vars.PRODUCTION_SERVER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ]; then
            echo "::warning::Repository variable PRODUCTION_SERVER_URL is not set. This build cannot reach a game server."
          fi
          echo "url=${URL:-}" >> "$GITHUB_OUTPUT"

      # versionName comes from app.json (checked against the tag above);
      # versionCode is the workflow run number, which only ever increases, as
      # Play requires.
      - name: Generate the native project
        working-directory: apps/mobile
        env:
          CI: '1'
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --clean --no-install

      # The keystore never enters the repository. It is restored from an
      # encrypted secret into the runner's temp dir and shredded below.
      # plugins/with-android-release.js falls back to debug signing when
      # keystore.properties is absent, so an unsigned dry run still completes.
      - name: Restore upload keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. Building DEBUG-SIGNED artifacts that cannot be uploaded to Play."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          {
            printf 'storeFile=%s\n'     "$KEYSTORE_PATH"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n'      "$KEY_ALIAS"
            printf 'keyPassword=%s\n'   "$KEY_PASSWORD"
          } > apps/mobile/android/keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Two Gradle runs, bundle first: AGP refuses to build an .aab while ABI
      # splits are enabled (https://issuetracker.google.com/402800800). The
      # second run reuses the compiled JS bundle and native libraries.
      - name: Build App Bundle
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_SERVER_URL: ${{ steps.server.outputs.url }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build split and universal APKs
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_SERVER_URL: ${{ steps.server.outputs.url }}
        run: ./gradlew assembleRelease -PsplitApks --no-daemon --stacktrace

      - name: Assert the shipped APK requests only the allowed permissions
        run: ./tool/check-android-permissions.sh apps/mobile/android/app/build/outputs/apk/release/app-universal-release.apk

      - name: Collect and checksum artifacts
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          OUT=apps/mobile/android/app/build
          SUFFIX=""
          [ "$SIGNED" = "true" ] || SUFFIX="-UNSIGNED"
          mkdir -p dist
          cp "$OUT/outputs/bundle/release/app-release.aab"          "dist/gridlock-$VERSION$SUFFIX.aab"
          cp "$OUT/outputs/apk/release/app-universal-release.apk"   "dist/gridlock-$VERSION$SUFFIX-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            src="$OUT/outputs/apk/release/app-$abi-release.apk"
            [ -f "$src" ] && cp "$src" "dist/gridlock-$VERSION$SUFFIX-$abi.apk" || true
          done
          # The Hermes source map and the R8 mapping are the only way to read a
          # crash from a minified, shrunk build. They are published with it.
          MAP="$OUT/generated/sourcemaps/react/release/index.android.bundle.map"
          [ -f "$MAP" ] && cp "$MAP" "dist/gridlock-$VERSION-js-sourcemap.map" || echo "::warning::no JS source map at $MAP"
          R8="$OUT/outputs/mapping/release/mapping.txt"
          [ -f "$R8" ] && cp "$R8" "dist/gridlock-$VERSION-r8-mapping.txt" || echo "::warning::no R8 mapping at $R8"
          ls -lh dist

      - name: Shred signing material
        if: always()
        run: rm -f apps/mobile/android/keystore.properties "$RUNNER_TEMP/upload-keystore.jks"

      - uses: actions/upload-artifact@v5
        with:
          name: android-release
          path: dist/
          retention-days: 90

  publish:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, server-image, web, android]
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: '*-release'
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          ls -lh

      - name: Publish GitHub Release
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Gridlock ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          draft: true
          files: dist/*
          body: |
            ## Gridlock ${{ needs.verify.outputs.version }}

            | | |
            |---|---|
            | Version name | `${{ needs.verify.outputs.version }}` |
            | Android version code | `${{ github.run_number }}` |
            | Android signing | `${{ needs.android.outputs.signed == 'true' && 'upload key' || 'DEBUG KEY — NOT uploadable to Play' }}` |
            | Game server baked into the app | `${{ needs.android.outputs.server_url || 'NOT SET — app cannot connect' }}` |
            | Server image | `${{ needs.server-image.outputs.image }}` |
            | Server deployed | `${{ needs.server-image.outputs.deployed == 'true' && 'yes (deploy hook)' || 'no — image published only' }}` |

            **Android** — upload the **`.aab`** to Play. The `.apk` files are for
            sideloading and manual testing only.

            **Server** — `docker pull ${{ needs.server-image.outputs.image }}`

            **Web** — `gridlock-${{ needs.verify.outputs.version }}-web.zip` is a static
            site; serve it from any static host.

            Verify downloads against `SHA256SUMS.txt`. Keep `*-js-sourcemap.map` and
            `*-r8-mapping.txt`: released builds are minified, and without them a
            crash report is unreadable.

  notify:
    name: Telegram
    runs-on: ubuntu-latest
    needs: [verify, server-image, web, android, publish]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTCOME: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failed' || 'succeeded' }}
          VERIFY: ${{ needs.verify.result }}
          SERVER: ${{ needs.server-image.result }}
          WEB: ${{ needs.web.result }}
          ANDROID: ${{ needs.android.result }}
          PUBLISH: ${{ needs.publish.result }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag || github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNED: ${{ needs.android.outputs.signed }}
          SERVER_URL: ${{ needs.android.outputs.server_url }}
          IMAGE: ${{ needs.server-image.outputs.image }}
          DEPLOYED: ${{ needs.server-image.outputs.deployed }}
          RELEASE_URL: ${{ needs.publish.outputs.release_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are not set — skipping notification."
            exit 0
          fi

          esc() {
            printf '%s' "${1:-}" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }
          icon() {
            case "${1:-}" in
              success)   printf '✅' ;;
              failure)   printf '❌' ;;
              cancelled) printf '⚠️' ;;
              *)         printf '➖' ;;
            esac
          }

          if [ "$OUTCOME" = failed ]; then HEAD='🔴'; else HEAD='🚀'; fi

          # An unsigned build is a successful run that produced nothing
          # uploadable. Saying only "succeeded" would be misleading.
          if [ "${SIGNED:-}" = "true" ]; then
            SIGNING='✅ signed with the upload key'
          else
            SIGNING='⚠️ DEBUG KEY — cannot be uploaded to Play'
          fi
          if [ -n "${SERVER_URL:-}" ]; then
            BAKED="<code>$(esc "$SERVER_URL")</code>"
          else
            BAKED='⚠️ NOT SET — the app cannot connect'
          fi
          if [ "${DEPLOYED:-}" = "true" ]; then DEPLOY='✅ deploy hook triggered'; else DEPLOY='➖ image published only'; fi

          LINK="<a href=\"$RUN_URL\">View run</a>"
          if [ -n "${RELEASE_URL:-}" ]; then
            LINK="<a href=\"$RELEASE_URL\">Draft release</a> · $LINK"
          fi

          TEXT=$(cat <<EOF
          $HEAD <b>Release $OUTCOME</b> — $(esc "$REPO")

          <b>Version</b> <code>$(esc "$VERSION")</code> (build $BUILD_NUMBER)
          <b>Tag</b> <code>$(esc "$TAG")</code>
          <b>Signing</b> $SIGNING
          <b>Server URL</b> $BAKED
          <b>Image</b> <code>$(esc "${IMAGE:-—}")</code>
          <b>Deploy</b> $DEPLOY

          $(icon "$VERIFY") Verify tag and tests
          $(icon "$SERVER") Server image
          $(icon "$WEB") Web build
          $(icon "$ANDROID") Android artifacts
          $(icon "$PUBLISH") Draft release

          $LINK
          EOF
          )

          curl -sS --fail-with-body -o /dev/null \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            --data-urlencode text="$TEXT"
          echo "Notification sent."
