name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch makes the in-flight run pointless, so cancel it.
# main is exempt: those runs are the record of what landed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  verify:
    name: Format, lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` refuses to run when package-lock.json disagrees with the
      # package.json files, so a drifting lockfile fails here instead of being
      # silently rewritten.
      - name: Install (lockfile enforced)
        run: npm ci --no-audit --no-fund

      - name: Versions agree across the repository
        run: node tool/version.mjs check

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (engine unit + server integration)
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-lcov
          path: |
            packages/engine/coverage/lcov.info
            apps/server/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  server:
    name: Server bundle & Docker image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build server bundle
        run: npm run build:server

      - uses: docker/setup-buildx-action@v3

      # Built, not pushed: this proves the Dockerfile still works. Publishing
      # happens only from release.yml, on a version tag.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: gridlock-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  web:
    name: Web build
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Export static web build
        run: npm run build:web

  build-android:
    name: Android release build (unsigned)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Not setup-java's `cache: gradle`: that keys on build files, and ours
      # only exist after `expo prebuild` generates android/. setup-gradle caches
      # the Gradle home (wrapper, dependencies, build cache) without them.
      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Generate the native project
        working-directory: apps/mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      # No signing secrets here on purpose: this job proves the release
      # toolchain (R8, resource shrinking, Hermes bytecode) still builds. One
      # architecture keeps it quick; release.yml builds all four. The APK is
      # debug-signed and deliberately not uploaded anywhere.
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Assert the release build requests only the allowed permissions
        run: ./tool/check-android-permissions.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk

  build-ios:
    name: iOS release build (unsigned)
    runs-on: macos-latest
    needs: verify
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Generate the native project
        working-directory: apps/mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install

      # CODE_SIGNING_ALLOWED=NO keeps this honest without Apple credentials in
      # CI: it still compiles, links and bundles exactly as the store build does.
      - name: Build iOS (Release, device SDK, no codesign)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Gridlock.xcworkspace \
            -scheme Gridlock \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 60

  notify:
    name: Telegram
    runs-on: ubuntu-latest
    needs: [verify, server, web, build-android, build-ios]
    # always(): a notifier that only runs when the build passed is useless.
    # Restricted to pushes on main — PR runs would drown the chat.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # needs.*.result is 'success' | 'failure' | 'cancelled' | 'skipped'.
          OUTCOME: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failed' || 'passed' }}
          VERIFY: ${{ needs.verify.result }}
          SERVER: ${{ needs.server.result }}
          WEB: ${{ needs.web.result }}
          ANDROID: ${{ needs.build-android.result }}
          IOS: ${{ needs.build-ios.result }}
          # Passed through env, never interpolated into the script body. A commit
          # message is attacker-controlled text, and ${{ }} inside `run:` is
          # pasted in before bash ever sees it — that is a shell injection.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are not set — skipping notification."
            exit 0
          fi

          # Telegram's HTML mode rejects a stray &, < or >. Ampersand is escaped
          # first, or it would re-escape the ones the later rules introduce.
          esc() {
            printf '%s' "${1:-}" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }
          icon() {
            case "${1:-}" in
              success)   printf '✅' ;;
              failure)   printf '❌' ;;
              cancelled) printf '⚠️' ;;
              *)         printf '➖' ;;
            esac
          }

          if [ "$OUTCOME" = failed ]; then HEAD='🔴'; else HEAD='🟢'; fi
          SUBJECT=$(printf '%s' "${COMMIT_MESSAGE:-}" | head -1)

          TEXT=$(cat <<EOF
          $HEAD <b>CI $OUTCOME</b> — $(esc "$REPO")

          <b>Commit</b> <code>${COMMIT_SHA:0:7}</code> $(esc "$SUBJECT")
          <b>By</b> $(esc "$ACTOR")

          $(icon "$VERIFY") Format, lint, typecheck &amp; test
          $(icon "$SERVER") Server bundle &amp; Docker image
          $(icon "$WEB") Web build
          $(icon "$ANDROID") Android release build
          $(icon "$IOS") iOS release build

          <a href="$RUN_URL">View run</a>
          EOF
          )

          curl -sS --fail-with-body -o /dev/null \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            --data-urlencode text="$TEXT"
          echo "Notification sent."
